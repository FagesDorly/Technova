<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TechNova Computers</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Concept: accueil chaleureux. Formes douces, couleurs vives mais apaisées, ton de conversation,
   un échange type en guise d'illustration, le devis comme un panier qu'on remplit à deux. */
:root{
  --bg:#F7F5F2; --surface:#FFFFFF; --surface-2:#EFEBE6;
  --ink:#1B2F3A; --muted:#566870; --line:#E4DED7;
  --accent:#C9432D; --accent-ink:#FFFFFF; --accent-soft:#FDE6E0;
  --teal:#1F7A8C; --teal-soft:#DAEEF2;
  --sun:#FFD166; --sun-soft:#FFF1C9;
  --ok:#17784A; --ok-soft:#DDF3E6; --warn:#855100; --warn-soft:#FBE8C4;
  --shadow:0 1px 0 rgba(27,47,58,.04),0 14px 28px -16px rgba(27,47,58,.28);
  --f-display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111B21; --surface:#192830; --surface-2:#22333C;
    --ink:#EEF2F0; --muted:#A3B3BA; --line:#2C3E48;
    --accent:#FF8F78; --accent-ink:#2A0F09; --accent-soft:#3A221D;
    --teal:#6FC6D6; --teal-soft:#1A3A43;
    --sun:#E9B93C; --sun-soft:#3A3114;
    --ok:#6ADBA2; --ok-soft:#173A2B; --warn:#F2C468; --warn-soft:#3B2E12;
    --shadow:0 14px 28px -16px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111B21; --surface:#192830; --surface-2:#22333C;
  --ink:#EEF2F0; --muted:#A3B3BA; --line:#2C3E48;
  --accent:#FF8F78; --accent-ink:#2A0F09; --accent-soft:#3A221D;
  --teal:#6FC6D6; --teal-soft:#1A3A43;
  --sun:#E9B93C; --sun-soft:#3A3114;
  --ok:#6ADBA2; --ok-soft:#173A2B; --warn:#F2C468; --warn-soft:#3B2E12;
  --shadow:0 14px 28px -16px rgba(0,0,0,.7);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--f-body);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:-.015em;line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
.wrap{width:100%;max-width:1200px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tagline{display:inline-block;font-size:14px;font-weight:600;padding:6px 14px;border-radius:999px;background:var(--sun-soft);color:var(--ink)}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
section[id]{scroll-margin-top:96px}

/* Buttons */
.btn{font:inherit;font-weight:700;font-size:16px;line-height:1.2;padding:13px 22px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,background .15s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07);background:var(--accent)}
.btn.small{padding:9px 16px;font-size:15px}

/* Header */
.site-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.02em;margin-right:auto}
.brand svg{width:34px;height:34px;flex:none}
.brand span{font-weight:600;color:var(--muted)}
.nav{display:none;order:3;width:100%;flex-direction:column;gap:2px;padding:6px 0 14px}
.nav.open{display:flex}
.nav a{padding:13px 16px;border-radius:16px;text-decoration:none;font-size:18px;font-weight:600;color:var(--ink)}
.nav a:hover{background:var(--surface-2)}
.nav .nav-cta{margin-top:10px;justify-content:center;color:var(--accent-ink);padding:14px 22px;border-radius:999px}
.nav .nav-cta:hover{background:var(--accent);filter:brightness(1.07)}
.hdr-actions{display:flex;gap:8px;align-items:center}
.hdr-cta{display:none!important}
.lang{padding:8px 13px;font-size:14px}
.menu-btn{width:44px;height:44px;padding:0;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.menu-btn span{display:block;width:20px;height:2.5px;border-radius:2px;background:var(--ink);transition:transform .2s,opacity .2s}
.menu-btn[aria-expanded="true"] span:nth-child(1){transform:translateY(7.5px) rotate(45deg)}
.menu-btn[aria-expanded="true"] span:nth-child(2){opacity:0}
.menu-btn[aria-expanded="true"] span:nth-child(3){transform:translateY(-7.5px) rotate(-45deg)}
@media (prefers-reduced-motion:reduce){.menu-btn span{transition:none}}
@media (min-width:860px){
  .menu-btn,.nav-cta{display:none!important}
  .nav{display:flex;flex-direction:row;order:0;width:auto;gap:2px;padding:0;margin-left:10px;margin-right:auto}
  .nav a{padding:7px 14px;font-size:15px;color:var(--muted);border-radius:999px;white-space:nowrap}
  .nav a:hover{color:var(--ink)}
  .hdr{flex-wrap:nowrap}
  .brand{margin-right:0}
  .hdr-cta{display:inline-flex!important}
}

/* Hero */
.hero{position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(520px 340px at 88% 12%,var(--sun-soft),transparent 70%),radial-gradient(520px 380px at 4% 100%,var(--teal-soft),transparent 70%);pointer-events:none}
.hero-in{position:relative;display:grid;gap:40px;padding-block:44px 52px}
@media (min-width:900px){.hero-in{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:center;gap:56px;padding-block:72px 76px}}
.hero h1{font-size:clamp(2.3rem,5.6vw,3.9rem);margin:18px 0 20px}
.hl{background-image:linear-gradient(transparent 62%,var(--sun) 62%,var(--sun) 92%,transparent 92%);padding-inline:2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.lead{max-width:54ch;font-size:19px;color:var(--muted)}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}

/* Chat illustration */
.chat{background:var(--surface);border-radius:28px;padding:22px;box-shadow:var(--shadow);display:grid;gap:14px;min-width:0}
.chat-label{font-size:13px;font-weight:600;color:var(--muted);text-align:center}
.row{display:flex;gap:10px;align-items:flex-end;min-width:0}
.row.me{justify-content:flex-end}
.av{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:16px}
.bub{max-width:82%;padding:12px 16px;border-radius:20px;font-size:16px;line-height:1.45;overflow-wrap:anywhere}
.row.us .bub{background:var(--surface-2);border-bottom-left-radius:6px}
.row.me .bub{background:var(--teal-soft);border-bottom-right-radius:6px}
.bub.free{max-width:100%}

/* Clients strip */
.clients-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-block:6px 40px}
.clients-in strong{font-size:15px;margin-right:6px}
.chip{font-size:15px;font-weight:600;padding:7px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}

/* Sections */
.sec{padding-block:72px}
.sec-head{display:grid;gap:12px;margin-bottom:34px;max-width:62ch}
.sec h2{font-size:clamp(1.9rem,4vw,2.7rem)}
.sec-head p{color:var(--muted);font-size:18px}

/* Catalogue */
.shop{display:grid;gap:32px}
@media (min-width:1020px){.shop{grid-template-columns:minmax(0,1fr) 350px;align-items:start}}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.filter{font:inherit;font-size:15px;font-weight:600;padding:9px 18px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.filter:hover{border-color:var(--teal)}
.filter[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(215px,1fr))}
.card{display:flex;flex-direction:column;min-width:0;background:var(--surface);border-radius:24px;padding:12px;box-shadow:var(--shadow)}
.thumb{height:112px;display:grid;place-items:center;position:relative;border-radius:16px;overflow:hidden;color:var(--ink)}
.thumb::before{content:"";position:absolute;width:132px;height:100px;border-radius:58% 42% 52% 48% / 46% 58% 42% 54%;background:var(--blob)}
.thumb svg{position:relative;width:72px;height:50px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.thumb.laptops{background:var(--teal-soft);--blob:var(--surface)}
.thumb.desktops{background:var(--accent-soft);--blob:var(--surface)}
.thumb.monitors{background:var(--sun-soft);--blob:var(--surface)}
.thumb.accessories{background:var(--surface-2);--blob:var(--surface)}
.cbody{display:flex;flex-direction:column;gap:8px;padding:14px 8px 6px;flex:1}
.sku{font-size:12px;font-weight:600;letter-spacing:.07em;color:var(--muted)}
.pname{font-weight:700;font-size:19px;line-height:1.25;font-family:var(--f-display);overflow-wrap:anywhere}
.price{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px}
.price small{font-size:13px;font-weight:500;color:var(--muted)}
.pill{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;padding:4px 11px;border-radius:999px}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.in{background:var(--ok-soft);color:var(--ok)}
.pill.ltd{background:var(--warn-soft);color:var(--warn)}
.cbody .spacer{flex:1}
.card .btn{margin-top:6px}

/* Quote */
.quote{background:var(--surface);border-radius:28px;box-shadow:var(--shadow);min-width:0;overflow:hidden}
@media (min-width:1020px){.quote{position:sticky;top:calc(96px + env(safe-area-inset-top,0px))}}
.q-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 22px;background:var(--sun-soft)}
.q-head h2{font-size:24px}
.q-count{font-size:14px;font-weight:700;background:var(--surface);padding:3px 12px;border-radius:999px}
.q-body{padding:6px 22px 22px}
.q-empty{padding:18px 0 4px;color:var(--muted)}
.q-line{padding:14px 0;border-bottom:1px solid var(--line);display:grid;gap:10px}
.q-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.q-name{font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.q-rm{font:inherit;font-size:22px;line-height:1;border:0;background:none;color:var(--muted);cursor:pointer;padding:0 6px;border-radius:50%}
.q-rm:hover{color:var(--accent)}
.q-bot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stepper{display:inline-flex;align-items:center;border-radius:999px;background:var(--surface-2)}
.stepper button{font:inherit;font-size:19px;font-weight:700;width:36px;height:36px;border:0;background:none;color:var(--ink);cursor:pointer;border-radius:50%}
.stepper button:hover{background:var(--line)}
.stepper output{min-width:28px;text-align:center;font-weight:700}
.q-lt{font-variant-numeric:tabular-nums;font-weight:700}
.q-flag{font-size:13px;color:var(--warn);font-weight:600}
.q-total{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-top:18px}
.q-total span:first-child{font-size:15px;color:var(--muted)}
.q-total strong{font-family:var(--f-display);font-size:28px;font-variant-numeric:tabular-nums}
.q-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.q-note{margin-top:16px;font-size:14px;color:var(--muted)}

/* Order steps */
.band-teal{background:var(--teal-soft)}
.steps{display:grid;gap:18px;list-style:none;margin:0;padding:0;counter-reset:s}
@media (min-width:820px){.steps{grid-template-columns:repeat(3,minmax(0,1fr))}}
.step{background:var(--surface);border-radius:24px;padding:26px;display:grid;gap:12px;align-content:start;counter-increment:s;box-shadow:var(--shadow)}
.step::before{content:counter(s);width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:22px}
.step h3{font-size:22px}
.step p{color:var(--muted);font-size:16px}

/* Support */
.sup{display:grid;gap:36px}
@media (min-width:900px){.sup{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:64px;align-items:center}}
.tags{display:flex;flex-wrap:wrap;gap:10px}
.tag{font-size:15px;font-weight:700;padding:8px 18px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.msg{background:var(--surface);border-radius:28px;padding:22px;display:grid;gap:14px;box-shadow:var(--shadow);min-width:0}
.msg .bub{white-space:pre-line}

/* FAQ */
.band-sun{background:var(--sun-soft)}
.faq{display:grid;gap:12px;max-width:820px}
.faq details{background:var(--surface);border-radius:20px}
.faq summary{cursor:pointer;list-style:none;padding:18px 22px;font-weight:700;font-size:18px;display:flex;justify-content:space-between;gap:16px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-size:20px;line-height:1}
.faq details[open] summary::after{content:"\2212"}
.faq details p{padding:0 22px 20px;color:var(--muted)}

/* Contact */
.contact{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.cc{background:var(--surface);border-radius:24px;padding:24px;display:grid;gap:8px;align-content:start;min-width:0;box-shadow:var(--shadow)}
.cc .label{font-size:14px;font-weight:600;color:var(--muted)}
.cc .val{font-family:var(--f-display);font-weight:700;font-size:21px;overflow-wrap:anywhere;text-decoration:none}
.cc a.val:hover{color:var(--accent)}
.cc .btn{justify-self:start;margin-top:6px}

footer{padding-block:32px calc(32px + 56px);font-size:14px;color:var(--muted);border-top:1px solid var(--line)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 24px}

/* Floating quote pill + toast */
.pillbtn{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;box-shadow:0 10px 24px -6px rgba(0,0,0,.35)}
@media (min-width:1020px){.pillbtn{display:none!important}}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px;font-size:15px;font-weight:600;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap hdr">
    <a class="brand" href="#top" aria-label="TechNova Computers">
      <svg viewBox="0 0 34 34" aria-hidden="true"><path d="M17 1.5c8.6 0 15.5 6.2 15.5 15.7S25.600 32.500 17 32.500 1.500 26.300 1.500 17 8.400 1.500 17 1.500z" fill="var(--accent)"/><path d="M11 24V10l12 14V10" fill="none" stroke="var(--accent-ink)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg>
      TechNova <span>Computers</span>
    </a>
    <nav class="nav" id="nav" aria-label="Navigation">
      <a href="#catalogue" data-i18n="nav_catalogue"></a>
      <a href="#commander" data-i18n="nav_order"></a>
      <a href="#apres-vente" data-i18n="nav_support"></a>
      <a href="#faq" data-i18n="nav_faq"></a>
      <a href="#contact" data-i18n="nav_contact"></a>
      <a class="btn primary nav-cta" href="#devis" data-i18n="cta_quote"></a>
    </nav>
    <div class="hdr-actions">
      <button class="btn small lang" id="lang" type="button" aria-label="Changer de langue / Change language">EN</button>
      <a class="btn primary small hdr-cta" href="#devis" data-i18n="cta_quote"></a>
      <button class="btn menu-btn" id="menu" type="button" aria-expanded="false" aria-controls="nav" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<main id="top">
  <div class="hero">
    <div class="wrap hero-in">
      <div>
        <span class="tagline" data-i18n="eyebrow"></span>
        <h1><span data-i18n="h1a"></span> <span class="hl" data-i18n="h1b"></span></h1>
        <p class="lead" data-i18n="lead"></p>
        <div class="hero-cta">
          <a class="btn primary" href="#catalogue" data-i18n="cta_browse"></a>
          <a class="btn" href="#devis" data-i18n="cta_build"></a>
        </div>
      </div>
      <div class="chat">
        <p class="chat-label" data-i18n="chat_label"></p>
        <div class="row me"><div class="bub" data-i18n="b1"></div></div>
        <div class="row us"><span class="av" aria-hidden="true">T</span><div class="bub" data-i18n="b2"></div></div>
        <div class="row me"><div class="bub" data-i18n="b3"></div></div>
        <div class="row us"><span class="av" aria-hidden="true">T</span><div class="bub" data-i18n="b4"></div></div>
      </div>
    </div>
    <div class="wrap clients-in">
      <strong data-i18n="clients_label"></strong>
      <span class="chip" data-i18n="c1"></span>
      <span class="chip" data-i18n="c2"></span>
      <span class="chip" data-i18n="c3"></span>
      <span class="chip" data-i18n="c4"></span>
      <span class="chip" data-i18n="c5"></span>
    </div>
  </div>

  <section class="sec" id="catalogue">
    <div class="wrap">
      <div class="sec-head">
        <h2 data-i18n="cat_title"></h2>
        <p data-i18n="cat_lead"></p>
      </div>
      <div class="shop">
        <div>
          <div class="filters" id="filters" role="group" aria-label="Catégories">
            <button class="filter" type="button" data-cat="all" data-i18n="f_all"></button>
            <button class="filter" type="button" data-cat="laptops" data-i18n="f_laptops"></button>
            <button class="filter" type="button" data-cat="desktops" data-i18n="f_desktops"></button>
            <button class="filter" type="button" data-cat="monitors" data-i18n="f_monitors"></button>
            <button class="filter" type="button" data-cat="accessories" data-i18n="f_accessories"></button>
          </div>
          <div class="grid" id="grid"></div>
        </div>
        <aside class="quote" id="devis" aria-labelledby="q-title">
          <div class="q-head">
            <h2 id="q-title" data-i18n="q_title"></h2>
            <span class="q-count" id="q-count"></span>
          </div>
          <div class="q-body" id="q-body"></div>
        </aside>
      </div>
    </div>
  </section>

  <section class="sec band-teal" id="commander">
    <div class="wrap">
      <div class="sec-head"><h2 data-i18n="order_title"></h2><p data-i18n="order_lead"></p></div>
      <ol class="steps">
        <li class="step"><h3 data-i18n="s1t"></h3><p data-i18n="s1p"></p></li>
        <li class="step"><h3 data-i18n="s2t"></h3><p data-i18n="s2p"></p></li>
        <li class="step"><h3 data-i18n="s3t"></h3><p data-i18n="s3p"></p></li>
      </ol>
    </div>
  </section>

  <section class="sec" id="apres-vente">
    <div class="wrap sup">
      <div>
        <div class="sec-head"><h2 data-i18n="sup_title"></h2><p data-i18n="sup_p"></p></div>
        <div class="tags">
          <span class="tag" data-i18n="t1"></span><span class="tag" data-i18n="t2"></span><span class="tag" data-i18n="t3"></span><span class="tag" data-i18n="t4"></span>
        </div>
      </div>
      <div class="msg">
        <p class="chat-label" data-i18n="sup_ex_label"></p>
        <div class="row me"><div class="bub" data-i18n="sup_ex"></div></div>
        <div class="row us"><span class="av" aria-hidden="true">T</span><div class="bub" data-i18n="sup_re"></div></div>
      </div>

  }

    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,fail)}else{fail()}
    }catch(e){fail()}
  }

    $('nav').classList.toggle('open',open);

  document.addEventListener('click',function(e){
    var open=$('nav').classList.contains('open');
    if(open&&!e.target.closest('.site-header'))setMenu(false);
    var el=e.target.closest('button,a');if(!el)return;
    var d=el.dataset;
    if(el.id==='menu'){setMenu(!open);return}
    if(open&&el.closest('#nav')){setMenu(false);return}
    if(d.add){setQty(d.add,(cart[d.add]||0)+1);toast(BY[d.add].name+' ✓');return}
    if(d.inc){setQty(d.inc,cart[d.inc]+1);return}
    if(d.dec){setQty(d.dec,cart[d.dec]-1);return}
    if(d.rm){setQty(d.rm,0);return}
    if(d.cat){cat=d.cat;renderFilters();renderGrid();return}
    if(d.copy){copyText(d.copy);return}
    if(el.id==='q-copy'){copyText(quoteText());return}
    if(el.id==='q-clear'){cart={};save();renderGrid();renderQuote();return}
    if(el.id==='lang'){lang=lang==='fr'?'en':'fr';try{localStorage.setItem('tn-lang',lang)}catch(x){}applyStatic();renderAll();return}
  });
